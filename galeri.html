<!DOCTYPE html>

    <h2>Galeri Latihan Mandiri</h2>

      <input type="text" id="fotoCatatan" placeholder="Catatan singkat (opsional)">

      <button type="button" id="hapusSemuaBtn" class="btn" style="background:#e57373;color:#fff;">Hapus Semua Foto</button>
    </form>
    <div id="galeriGrid" class="card-grid"></div>
